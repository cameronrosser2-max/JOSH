<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Josh — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07090d;color:#dde4f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#0d1017;border:1px solid #1f2a3a;border-radius:16px;padding:36px 32px;width:100%;max-width:360px;text-align:center}
    .logo{width:52px;height:52px;background:linear-gradient(135deg,#4f8ef7,#9b74f7);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;margin:0 auto 20px;box-shadow:0 4px 20px rgba(79,142,247,.35)}
    h1{font-size:20px;font-weight:700;margin-bottom:6px}
    p{font-size:13px;color:#4a5878;margin-bottom:24px}
    input{background:#07090d;border:1px solid #1f2a3a;border-radius:9px;color:#dde4f0;font-size:16px;padding:12px 14px;width:100%;outline:none;text-align:center;letter-spacing:.15em;margin-bottom:12px;transition:border-color .2s}
    input:focus{border-color:#4f8ef7}
    button{width:100%;padding:13px;border-radius:9px;border:none;background:linear-gradient(135deg,#4f8ef7,#9b74f7);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:filter .2s}
    button:hover{filter:brightness(1.1)}
    .error{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.25);border-radius:8px;color:#e05c5c;font-size:13px;padding:10px;margin-bottom:14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">J</div>
    <h1>Josh Outreach</h1>
    <p>Enter your dashboard PIN to continue</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="pin" placeholder="Enter PIN" autofocus/>
      <button type="submit">Unlock Dashboard</button>
    </form>
  </div>
</body>
</html>
